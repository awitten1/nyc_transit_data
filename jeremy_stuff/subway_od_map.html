<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MTA Subway Origin–Destination Ridership</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }

    #header {
      padding: 8px 14px;
      background: #1a1d27;
      border-bottom: 1px solid #2e3147;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; }

    .ctrl-group { display: flex; align-items: center; gap: 6px; }
    .ctrl-label { font-size: 11px; color: #888; white-space: nowrap; }

    select {
      background: #252836; color: #e0e0e0;
      border: 1px solid #3a3f55; border-radius: 5px;
      padding: 4px 7px; font-size: 12px; cursor: pointer; min-width: 240px;
    }
    select:focus { outline: none; border-color: #5b8dee; }

    input[type=range] { accent-color: #5b8dee; cursor: pointer; }
    .val-badge {
      font-size: 12px; font-weight: 600; color: #5b8dee;
      background: #1e2438; border: 1px solid #3a3f55;
      border-radius: 4px; padding: 2px 6px; min-width: 28px; text-align: center;
    }

    #hour-display {
      font-size: 12px; font-weight: 600; color: #fff;
      background: #252836; border: 1px solid #3a3f55;
      border-radius: 5px; padding: 3px 9px; min-width: 90px; text-align: center;
      white-space: nowrap;
    }
    #hour-all-btn {
      font-size: 11px; color: #888; background: #252836;
      border: 1px solid #3a3f55; border-radius: 5px;
      padding: 3px 8px; cursor: pointer; white-space: nowrap;
    }
    #hour-all-btn.active { color: #5b8dee; border-color: #5b8dee; }
    #hour-all-btn:hover { border-color: #5b8dee; }

    #main { display: flex; flex: 1; overflow: hidden; position: relative; }
    #map { flex: 1; }

    #sidebar {
      width: 290px; background: #1a1d27;
      border-left: 1px solid #2e3147;
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
    }
    #sidebar-header { padding: 10px 12px 7px; border-bottom: 1px solid #2e3147; flex-shrink: 0; }
    #sidebar-title { font-size: 13px; font-weight: 600; color: #fff; }
    #sidebar-subtitle { font-size: 11px; color: #777; margin-top: 2px; }

    #dest-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    .dest-item {
      padding: 6px 12px; cursor: pointer;
      border-bottom: 1px solid #1e2130; transition: background 0.1s;
    }
    .dest-item:hover { background: #222539; }
    .dest-item.highlighted { background: #1e3a5f; }
    .dest-name { font-size: 12px; color: #ddd; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest-bar-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .dest-bar-bg { flex: 1; height: 4px; background: #2a2d3e; border-radius: 2px; overflow: hidden; }
    .dest-bar { height: 100%; border-radius: 2px; }
    .dest-ridership { font-size: 11px; color: #777; white-space: nowrap; }

    #loading {
      position: fixed; inset: 0; background: rgba(15,17,23,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; gap: 12px;
    }
    .spinner { width: 36px; height: 36px; border: 3px solid #2e3147; border-top-color: #5b8dee; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #aaa; font-size: 13px; }

    #hour-fetching {
      display: none; position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(26,29,39,0.9); border: 1px solid #3a3f55;
      border-radius: 6px; padding: 5px 12px;
      font-size: 12px; color: #aaa; z-index: 500;
      backdrop-filter: blur(4px); pointer-events: none;
      white-space: nowrap;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1a1d27; }
    ::-webkit-scrollbar-thumb { background: #3a3f55; border-radius: 3px; }
  </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p id="loading-msg">Loading station data…</p></div>

<div id="header">
  <h1>MTA Subway O–D Ridership</h1>

  <div class="ctrl-group">
    <span class="ctrl-label">Origin:</span>
    <select id="station-select"><option value="">— Select a station —</option></select>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">Hour:</span>
    <input type="range" id="hour-slider" min="0" max="23" value="8" style="width:110px"/>
    <div id="hour-display">8 AM</div>
    <button id="hour-all-btn">All hours</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">Top</span>
    <input type="range" id="top-n" min="5" max="50" value="20" step="5" style="width:80px"/>
    <div class="val-badge" id="top-n-val">20</div>
    <span class="ctrl-label">dests</span>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="hour-fetching">Loading hourly data…</div>
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">No station selected</div>
      <div id="sidebar-subtitle">Click a station on the map</div>
    </div>
    <div id="dest-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, preferCanvas: true })
  .setView([40.728, -73.944], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ── State ──────────────────────────────────────────────────────────────────
let STATIONS = null;
let OD_ALL   = null;
let OD_HOUR  = {};        // lazy cache: hour -> od dict
let stationMarkers = {};
let flowLayers = [];
let selectedOriginId = null;
let selectedHour = 8;
let useAllHours = false;

const HOUR_LABELS = [
  '12 AM','1 AM','2 AM','3 AM','4 AM','5 AM','6 AM','7 AM',
  '8 AM','9 AM','10 AM','11 AM',
  '12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM','7 PM',
  '8 PM','9 PM','10 PM','11 PM'
];

// ── Boot ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('data/od_data.json');
    const data = await r.json();
    STATIONS = data.stations;
    OD_ALL   = data.od;
    document.getElementById('loading').style.display = 'none';
    setupUI();
    loadHour(selectedHour); // preload default hour in background
  } catch(e) {
    document.getElementById('loading-msg').textContent = 'Error: ' + e.message;
  }
}

// ── Lazy-load hourly data ──────────────────────────────────────────────────
async function loadHour(h) {
  if (OD_HOUR[h]) return OD_HOUR[h];
  document.getElementById('hour-fetching').style.display = 'block';
  try {
    const r = await fetch(`data/od_by_hour/hour_${String(h).padStart(2,'0')}.json`);
    OD_HOUR[h] = await r.json();
  } finally {
    document.getElementById('hour-fetching').style.display = 'none';
  }
  return OD_HOUR[h];
}

// ── Build UI ───────────────────────────────────────────────────────────────
function setupUI() {
  const sel = document.getElementById('station-select');
  Object.values(STATIONS)
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      sel.appendChild(opt);

      const m = L.circleMarker([s.lat, s.lon], dotStyle('#5b8dee', 5)).addTo(map);
      m.bindTooltip(s.name, { direction:'top', offset:[0,-6], opacity:0.9 });
      m.on('click', () => selectStation(s.id));
      stationMarkers[s.id] = m;
    });

  sel.addEventListener('change', e => { if (e.target.value) selectStation(e.target.value); });

  // Hour slider
  const slider  = document.getElementById('hour-slider');
  const display = document.getElementById('hour-display');
  slider.addEventListener('input', async e => {
    selectedHour = parseInt(e.target.value);
    useAllHours  = false;
    document.getElementById('hour-all-btn').classList.remove('active');
    display.textContent = HOUR_LABELS[selectedHour];
    if (selectedOriginId) {
      await loadHour(selectedHour);
      renderFlows(selectedOriginId);
      renderSidebar(selectedOriginId);
    }
  });

  // "All hours" toggle
  document.getElementById('hour-all-btn').addEventListener('click', () => {
    useAllHours = !useAllHours;
    document.getElementById('hour-all-btn').classList.toggle('active', useAllHours);
    display.textContent = useAllHours ? 'All hours' : HOUR_LABELS[selectedHour];
    if (selectedOriginId) { renderFlows(selectedOriginId); renderSidebar(selectedOriginId); }
  });

  // Top-N slider
  document.getElementById('top-n').addEventListener('input', e => {
    document.getElementById('top-n-val').textContent = e.target.value;
    if (selectedOriginId) { renderFlows(selectedOriginId); renderSidebar(selectedOriginId); }
  });
}

// ── Select origin station ──────────────────────────────────────────────────
async function selectStation(id) {
  selectedOriginId = id;
  document.getElementById('station-select').value = id;

  // Reset all markers first
  Object.entries(stationMarkers).forEach(([sid, m]) => {
    m.setStyle(dotStyle(sid === id ? '#fff' : '#5b8dee', sid === id ? 8 : 5));
    if (sid === id) { m.setStyle({ color:'#5b8dee', weight:2.5, fillOpacity:1 }); m.bringToFront(); }
  });

  if (!useAllHours) await loadHour(selectedHour);
  renderFlows(id);
  renderSidebar(id);
}

// ── Get OD list for current hour/all ──────────────────────────────────────
function getOD(originId) {
  if (useAllHours) return OD_ALL[originId] || [];
  return (OD_HOUR[selectedHour] || {})[originId] || [];
}

// ── Draw arc flows ─────────────────────────────────────────────────────────
function renderFlows(originId) {
  flowLayers.forEach(l => map.removeLayer(l));
  flowLayers = [];

  // Reset non-origin markers
  Object.entries(stationMarkers).forEach(([sid, m]) => {
    if (sid !== originId) m.setStyle(dotStyle('#5b8dee', 5));
  });

  const origin = STATIONS[originId];
  const dests  = getOD(originId);
  const topN   = parseInt(document.getElementById('top-n').value);
  const top    = dests.slice(0, topN).filter(([id]) => id !== originId);
  if (!top.length) return;

  const maxR = top[0][1];
  top.forEach(([destId, ridership]) => {
    const dest = STATIONS[destId];
    if (!dest) return;
    const t = maxR > 0 ? ridership / maxR : 0;
    const [r,g,b] = heatColor(t);
    const color = `rgb(${r},${g},${b})`;
    const weight  = 1.5 + t * 5.5;
    const opacity = 0.3 + t * 0.6;

    const arc = bezierArc([origin.lat, origin.lon], [dest.lat, dest.lon], 14);
    const line = L.polyline(arc, { color, weight, opacity, lineCap:'round', lineJoin:'round' }).addTo(map);

    const label = useAllHours ? 'All hours' : HOUR_LABELS[selectedHour];
    line.bindTooltip(
      `<b>${origin.name}</b> → <b>${dest.name}</b><br>` +
      `${label} · avg ridership: <b>${ridership.toLocaleString(undefined,{maximumFractionDigits:0})}</b>`,
      { sticky:true, opacity:0.93 }
    );
    line.on('mouseover', () => { line.setStyle({weight:weight+2.5,opacity:1}); hilightItem(destId); });
    line.on('mouseout',  () => { line.setStyle({weight,opacity}); hilightItem(null); });
    line._destId = destId;
    flowLayers.push(line);

    if (stationMarkers[destId]) {
      stationMarkers[destId].setStyle({ fillColor:color, radius:3+t*5, fillOpacity:0.9, color:'#1a1d27', weight:1 });
      stationMarkers[destId].bringToFront();
    }
  });
}

// ── Sidebar list ───────────────────────────────────────────────────────────
function renderSidebar(originId) {
  const origin = STATIONS[originId];
  const dests  = getOD(originId);
  const topN   = parseInt(document.getElementById('top-n').value);
  const top    = dests.slice(0, topN).filter(([id]) => id !== originId);
  const label  = useAllHours ? 'All hours' : HOUR_LABELS[selectedHour];

  document.getElementById('sidebar-title').textContent = origin.name;
  document.getElementById('sidebar-subtitle').textContent = `${label} · ${top.length} destinations`;

  const list = document.getElementById('dest-list');
  list.innerHTML = '';
  const maxR = top.length > 0 ? top[0][1] : 1;

  top.forEach(([destId, ridership], i) => {
    const dest = STATIONS[destId];
    if (!dest) return;
    const t = maxR > 0 ? ridership / maxR : 0;
    const [r,g,b] = heatColor(t);
    const color = `rgb(${r},${g},${b})`;
    const pct = Math.max(3, Math.round(t * 100));

    const item = document.createElement('div');
    item.className = 'dest-item';
    item.dataset.destId = destId;
    item.innerHTML = `
      <div class="dest-name">${i+1}. ${dest.name}</div>
      <div class="dest-bar-row">
        <div class="dest-bar-bg"><div class="dest-bar" style="width:${pct}%;background:${color}"></div></div>
        <div class="dest-ridership">${ridership.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
      </div>`;
    item.addEventListener('mouseenter', () => {
      hilightItem(destId);
      flowLayers.forEach(l => { if (l._destId===destId) l.setStyle({weight:9,opacity:1}); });
    });
    item.addEventListener('mouseleave', () => {
      hilightItem(null);
      renderFlows(originId);
    });
    item.addEventListener('click', () => map.flyTo([dest.lat, dest.lon], 13, {duration:0.7}));
    list.appendChild(item);
  });
}

function hilightItem(destId) {
  document.querySelectorAll('.dest-item').forEach(el =>
    el.classList.toggle('highlighted', el.dataset.destId === destId));
}

// ── Utilities ──────────────────────────────────────────────────────────────
function dotStyle(fill, r) {
  return { fillColor:fill, radius:r, color:'#1a1d27', weight:1.2, fillOpacity:0.85 };
}

function heatColor(t) {
  const stops = [[0,[91,141,238]],[0.4,[80,200,140]],[0.7,[240,180,40]],[1,[230,75,45]]];
  for (let i=1; i<stops.length; i++) {
    if (t <= stops[i][0]) {
      const [lo,hi] = [stops[i-1],stops[i]];
      const f = (t-lo[0])/(hi[0]-lo[0]);
      return lo[1].map((c,j) => Math.round(c + f*(hi[1][j]-c)));
    }
  }
  return stops[stops.length-1][1];
}

function bezierArc(from, to, steps) {
  const midLat=(from[0]+to[0])/2, midLon=(from[1]+to[1])/2;
  const dist=Math.sqrt((to[0]-from[0])**2+(to[1]-from[1])**2);
  const dx=to[1]-from[1], dy=to[0]-from[0];
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const [cpLat,cpLon]=[midLat-(dx/len)*dist*0.13, midLon+(dy/len)*dist*0.13];
  return Array.from({length:steps+1},(_,i)=>{
    const t=i/steps;
    return [(1-t)**2*from[0]+2*(1-t)*t*cpLat+t**2*to[0],
            (1-t)**2*from[1]+2*(1-t)*t*cpLon+t**2*to[1]];
  });
}

init();
</script>
</body>
</html>
