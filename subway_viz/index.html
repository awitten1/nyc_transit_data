<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Subway O-D Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── Controls shell ── */
  #controls {
    flex-shrink: 0;
    display: flex; flex-direction: column;
    background: #16213e; border-bottom: 1px solid #0f3460;
  }

  /* Row 1 — always-visible strip */
  #ctrl-top {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; flex-wrap: wrap;
  }
  #ctrl-top label { font-size: 12px; color: #a0a0c0; }
  #ctrl-top .group { display: flex; align-items: center; gap: 6px; }
  #ctrl-actions { margin-left: auto; display: flex; gap: 6px; }

  /* Row 2 — tab bar */
  #ctrl-tab-bar {
    display: flex; align-items: stretch;
    border-top: 1px solid #0f3460;
    background: #111928;
  }
  .tab-btn {
    padding: 5px 18px; font-size: 12px; font-weight: 500;
    background: transparent; color: #a0a0c0;
    border: none; border-right: 1px solid #0f3460;
    cursor: pointer; letter-spacing: 0.3px;
  }
  .tab-btn:hover { background: #1a2744; color: #e0e0e0; }
  .tab-btn.active {
    background: #16213e; color: #e0e0e0;
    border-bottom: 2px solid #e94560;
  }

  /* Row 3 — tab panel */
  .ctrl-panel {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 6px 16px; min-height: 40px;
    border-top: 1px solid #0f3460;
  }
  .ctrl-panel label { font-size: 12px; color: #a0a0c0; }
  .ctrl-panel .group { display: flex; align-items: center; gap: 6px; }
  .ctrl-panel select, .ctrl-panel input[type=text] {
    background: #1a1a2e; color: #e0e0e0; border: 1px solid #0f3460;
    padding: 3px 8px; border-radius: 4px; font-size: 12px;
  }
  #tab-presets.ctrl-panel { padding: 7px 16px; }
  #preset-group { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

  /* Ask AI panel */
  .ask-row {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 280px;
  }
  .ask-row input {
    flex: 1; background: #1a1a2e; color: #e0e0e0;
    border: 1px solid #0f3460; padding: 5px 10px;
    border-radius: 4px; font-size: 13px;
  }
  .ask-row input:focus { outline: none; border-color: #e94560; }
  .ask-row input::placeholder { color: #4a5568; }
  .ai-response { font-size: 12px; }
  .ai-thinking { color: #a0a0c0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ai-thinking { animation: pulse 1.2s infinite; }
  .ai-chip {
    display: inline-block; background: #0f3460; color: #00d2ff;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 0 2px;
  }
  .ai-note { color: #a0a0c0; font-style: italic; }

  /* Rain slider */
  input[type=range] {
    -webkit-appearance: none; width: 80px; height: 4px;
    background: #0f3460; border-radius: 2px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    background: #e94560; border-radius: 50%; cursor: pointer;
  }
  #rain-label { font-size: 11px; color: #a0a0c0; min-width: 32px; }

  /* Shared button styles */
  button, #delta-bar button {
    background: #4a5568; color: #e0e0e0; border: none;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #5a6578; }
  button.active { background: #e94560; color: white; }
  button.active:hover { background: #c73e54; }
  .mode-toggle { display: flex; border-radius: 4px; overflow: hidden; border: 1px solid #0f3460; }
  .mode-toggle button { padding: 4px 11px; font-size: 12px; border-radius: 0; }

  /* ── Layout ── */
  #delta-bar { flex-shrink: 0; }
  #maps-container { flex: 1; min-height: 0; display: flex; }
  #chart-container {
    flex-shrink: 0; min-height: 185px; background: #16213e;
    border-top: 1px solid #0f3460; padding: 6px 16px 4px;
    display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(300px, 1fr);
    gap: 14px; align-items: stretch;
  }
  #hourly-svg, #ranked-results-svg { display: block; width: 100%; }
  #journey-panel {
    border-left: 1px solid #0f3460; padding-left: 14px;
    display: grid; grid-template-columns: 1fr;
    gap: 10px; min-width: 0;
  }
  .journey-title { font-size: 11px; fill: #a0a0c0; }
  #journey-empty {
    grid-column: 1 / -1; align-self: center; color: #6a6a8a;
    font-size: 12px; line-height: 1.4;
  }
  #pair-bar-svg { width: 100%; display: block; }
  @media (max-width: 980px) {
    #chart-container { grid-template-columns: 1fr; }
    #journey-panel { border-left: none; border-top: 1px solid #0f3460; padding-left: 0; padding-top: 8px; }
  }
  #status {
    flex-shrink: 0; padding: 5px 20px; background: #16213e;
    border-top: 1px solid #0f3460; font-size: 12px; color: #a0a0c0;
    display: flex; justify-content: space-between;
  }

  .map-panel { flex: 1; position: relative; }
  .map-panel .map { width: 100%; height: 100%; }
  .map-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: rgba(22, 33, 62, 0.9); padding: 6px 16px;
    border-radius: 4px; font-size: 14px; font-weight: 600;
    border: 1px solid #0f3460; pointer-events: none;
  }
  .map-label.select { color: #e94560; }
  .map-label.result { color: #00d2ff; }
  .divider { width: 3px; background: #0f3460; cursor: col-resize; }
</style>
</head>
<body>

<div id="controls">

  <!-- Row 1: always-visible — dataset, mode, map, actions -->
  <div id="ctrl-top">
    <div class="group">
      <label>Dataset:</label>
      <div class="mode-toggle">
        <button id="ds-subway" class="active" onclick="toggleDataset('subway')">Subway</button>
        <button id="ds-citibike" onclick="toggleDataset('citibike')">Citibike</button>
        <button id="ds-taxi" onclick="toggleDataset('taxi')">Taxi</button>
      </div>
    </div>
    <div class="group">
      <label>Mode:</label>
      <div class="mode-toggle">
        <button id="mode-dest" onclick="setMode('dest')">Destinations</button>
        <button id="mode-origin" class="active" onclick="setMode('origin')">Origins</button>
      </div>
    </div>
    <div class="group">
      <div class="mode-toggle">
        <button id="btn-select" class="active" onclick="selectMode=true;updateSelectModeUI()">Select</button>
        <button id="btn-pan" onclick="selectMode=false;updateSelectModeUI()">Pan</button>
      </div>
    </div>
    <div id="ctrl-actions">
      <button id="btn-delta" onclick="toggleDeltaMode()">Δ Compare</button>
      <button onclick="clearSelection()">Clear</button>
      <button onclick="excludedIds.clear();reRenderResults()">Clear Excl.</button>
      <button type="button" onclick="goToClusters()">📅 Clusters</button>
    </div>
  </div>

  <!-- Row 2: tab bar -->
  <div id="ctrl-tab-bar">
    <button class="tab-btn active" onclick="switchTab('conditions')">⚙ Set Conditions</button>
    <button class="tab-btn" onclick="switchTab('presets')">★ Presets</button>
  </div>

  <!-- Panel: Set Conditions -->
  <div id="tab-conditions" class="ctrl-panel">
    <div class="group" id="member-filter" style="display:none">
      <label>Rider:</label>
      <select id="member-casual">
        <option value="">All</option>
        <option value="member">Member</option>
        <option value="casual">Casual</option>
      </select>
    </div>
    <div class="group">
      <label>Month:</label>
      <select id="month">
        <option value="">All</option>
        <option value="1">Jan</option><option value="2">Feb</option>
        <option value="3">Mar</option><option value="4">Apr</option>
        <option value="5">May</option><option value="6">Jun</option>
        <option value="7">Jul</option><option value="8">Aug</option>
        <option value="9">Sep</option><option value="10">Oct</option>
        <option value="11">Nov</option><option value="12">Dec</option>
      </select>
    </div>
    <div class="group">
      <label>Day:</label>
      <select id="day">
        <option value="">All</option>
        <option value="Weekday">Weekday (M–F)</option>
        <option value="Weekend">Weekend</option>
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
    </div>
    <div class="group">
      <label>Hours:</label>
      <select id="hour-start"><option value="">All</option></select>
      <span style="color:#718096">–</span>
      <select id="hour-end"><option value="">All</option></select>
    </div>
    <div class="group">
      <label>Rain ≥</label>
      <input type="range" id="rain-threshold" min="0" max="25" value="0" step="1"
             oninput="document.getElementById('rain-label').textContent=this.value+' mm'">
      <span id="rain-label">0 mm</span>
    </div>
  </div>

  <!-- Panel: Presets -->
  <div id="tab-presets" class="ctrl-panel" style="display:none">
    <div id="preset-group"></div>
  </div>

  <!-- Panel: Ask AI -->
  <div id="tab-ask" class="ctrl-panel" style="display:none">
    <div class="ask-row">
      <input type="text" id="ai-query"
             placeholder="e.g. Where do people go after a Knicks game at MSG?"
             onkeydown="if(event.key==='Enter')handleAIQuery()">
      <button onclick="handleAIQuery()">Ask →</button>
    </div>
    <div id="ai-response" class="ai-response"></div>
  </div>

</div>

<div id="delta-bar" style="display:none; padding:6px 20px; background:#16213e; border-bottom:1px solid #0f3460; align-items:center; gap:16px; flex-wrap:wrap;">
  <span style="font-size:12px; color:#e94560; font-weight:600;">vs (B)</span>
  <div class="group">
    <label>Month:</label>
    <select id="month-b">
      <option value="">All</option>
      <option value="1">Jan</option><option value="2">Feb</option>
      <option value="3">Mar</option><option value="4">Apr</option>
      <option value="5">May</option><option value="6">Jun</option>
      <option value="7">Jul</option><option value="8">Aug</option>
      <option value="9">Sep</option><option value="10">Oct</option>
      <option value="11">Nov</option><option value="12">Dec</option>
    </select>
  </div>
  <div class="group">
    <label>Day:</label>
    <select id="day-b">
      <option value="">All</option>
      <option value="Weekday">Weekday (M–F)</option>
      <option value="Weekend">Weekend</option>
      <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
      <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
    </select>
  </div>
  <div class="group">
    <label>Hours:</label>
    <select id="hour-start-b"><option value="">All</option></select>
    <span>–</span>
    <select id="hour-end-b"><option value="">All</option></select>
  </div>
  <button id="btn-normalize" class="active" onclick="toggleNormalize()" style="font-size:12px; padding:4px 10px;">÷ per hour</button>
  <span style="font-size:11px; color:#a0a0c0">■ cyan = more in A &nbsp; ■ <span style="color:#ff6b35">orange</span> = more in B</span>
</div>

<div id="maps-container">
  <div class="map-panel">
    <div class="map-label select" id="left-label">Select Origins — drag to select</div>
    <div id="map-left" class="map"></div>
  </div>
  <div class="divider"></div>
  <div class="map-panel">
    <div class="map-label result" id="right-label">Destinations will appear here</div>
    <div id="map-right" class="map"></div>
  </div>
</div>

<div id="chart-container">
  <svg id="hourly-svg"></svg>
  <svg id="ranked-results-svg"></svg>
  <div id="journey-panel">
    <div id="journey-empty">Click a result on the right map to inspect its O-D hourly volume profile.</div>
    <svg id="pair-bar-svg" style="display:none"></svg>
  </div>
</div>

<div id="status">
  <span id="status-left">0 selected</span>
  <span id="status-right">Total: —</span>
</div>

<script>
const NYC_CENTER = [40.7128, -74.0060];
const ZOOM = 11;

// Populate hour selects (A and B)
for (let h = 0; h < 24; h++) {
  const label = `${h.toString().padStart(2,'0')}:00`;
  const opt = `<option value="${h}">${label}</option>`;
  document.getElementById('hour-start').innerHTML += opt;
  document.getElementById('hour-end').innerHTML += opt;
  document.getElementById('hour-start-b').innerHTML += opt;
  document.getElementById('hour-end-b').innerHTML += opt;
}

// Create maps
const mapLeft = L.map('map-left', { zoomControl: false, boxZoom: false }).setView(NYC_CENTER, ZOOM);
const mapRight = L.map('map-right', { zoomControl: false }).setView(NYC_CENTER, ZOOM);

// Taxi polygons go into a pane below the default overlayPane (z=400) so
// subway/citibike circle markers always stay on top and remain hoverable.
mapLeft.createPane('taxiPane');
mapLeft.getPane('taxiPane').style.zIndex = 350;
mapRight.createPane('taxiPane');
mapRight.getPane('taxiPane').style.zIndex = 350;

// Selection mode: when enabled, drag draws a selection rectangle instead of panning
let selectMode = true;
mapLeft.dragging.disable();

function updateSelectModeUI() {
  document.getElementById('btn-select').classList.toggle('active', selectMode);
  document.getElementById('btn-pan').classList.toggle('active', !selectMode);
  document.getElementById('map-left').style.cursor = selectMode ? 'crosshair' : 'grab';
  if (selectMode) {
    mapLeft.dragging.disable();
  } else {
    mapLeft.dragging.enable();
  }
}

L.control.zoom({ position: 'bottomright' }).addTo(mapLeft);
L.control.zoom({ position: 'bottomright' }).addTo(mapRight);


const tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
const tileAttr = '&copy; OpenStreetMap &copy; CARTO';
L.tileLayer(tileUrl, { attribution: tileAttr }).addTo(mapLeft);
L.tileLayer(tileUrl, { attribution: tileAttr }).addTo(mapRight);

// Maps zoom and pan independently

// State
let activeDatasets = new Set(['subway']); // multiple can be active simultaneously
let allStationsPerDataset = {};           // { subway: [...], citibike: [...], taxi: [...] }
let taxiGeoJson = null;                   // raw GeoJSON for polygon rendering

// Namespace helpers — keys are "ds:id" to avoid collisions across datasets
function dsKey(ds, id) { return `${ds}:${id}`; }
function dsOfKey(key) { return key.slice(0, key.indexOf(':')); }
let mode = 'origin'; // 'dest' = select destinations, show origins. 'origin' = select origins, show destinations.
let selectedIds = new Set();
let excludedIds = new Set();
let stationMarkersLeft = {};
let resultMarkersRight = [];
let lastResultData = [];
let selectedPairDetail = null;
let selectionRect = null;
let dragStart = null;

// Colors
const DEFAULT_COLOR = '#4a5568';
const SELECTED_COLOR = '#e94560';
const RESULT_COLORS = ['#00d2ff', '#00b4d8', '#0096c7', '#0077b6', '#023e8a'];

function getResultColor(ratio) {
  // ratio 0-1, returns color from light blue to dark blue
  const idx = Math.min(Math.floor(ratio * RESULT_COLORS.length), RESULT_COLORS.length - 1);
  return RESULT_COLORS[idx];
}

function updateDatasetButtons() {
  ['subway', 'citibike', 'taxi'].forEach(ds => {
    document.getElementById(`ds-${ds}`).classList.toggle('active', activeDatasets.has(ds));
  });
  document.getElementById('member-filter').style.display = activeDatasets.has('citibike') ? '' : 'none';
}

async function toggleDataset(ds) {
  if (activeDatasets.has(ds)) {
    // Remove this dataset's markers and selections
    const stations = allStationsPerDataset[ds] || [];
    stations.forEach(s => {
      const key = dsKey(ds, s.station_id);
      if (stationMarkersLeft[key]) { mapLeft.removeLayer(stationMarkersLeft[key]); delete stationMarkersLeft[key]; }
      selectedIds.delete(key);
    });
    delete allStationsPerDataset[ds];
    activeDatasets.delete(ds);
    updateDatasetButtons();
    updateLeftMarkerStyles();
    if (selectedIds.size > 0) fetchResults(); else clearResults();
  } else {
    activeDatasets.add(ds);
    updateDatasetButtons();
    await loadDatasetStations(ds);
  }
}

async function loadDatasetStations(ds) {
  const resp = await fetch(`/api/${ds}/stations`);
  const stations = await resp.json();
  console.debug(`[${ds}] stations loaded: ${stations.length}`);
  if (stations.length > 0) console.debug(`[${ds}] sample station:`, stations[0]);
  allStationsPerDataset[ds] = stations;
  if (ds === 'taxi') {
    if (!taxiGeoJson) {
      const geoResp = await fetch('/api/taxi/zones');
      taxiGeoJson = await geoResp.json();
    }
    renderDatasetTaxiZones(stations);
  } else {
    renderDatasetStationMarkers(ds, stations);
  }
  console.debug(`[${ds}] markers in stationMarkersLeft after render:`,
    Object.keys(stationMarkersLeft).filter(k => k.startsWith(ds + ':')).length);
}

function renderDatasetStationMarkers(ds, stations) {
  let nullLatLng = 0;
  stations.forEach(s => {
    if (s.lat == null || s.lng == null) { nullLatLng++; return; }
    const key = dsKey(ds, s.station_id);
    const selected = selectedIds.has(key);
    const marker = L.circleMarker([s.lat, s.lng], {
      radius: selected ? 6 : 4,
      fillColor: selected ? SELECTED_COLOR : DEFAULT_COLOR,
      fillOpacity: selected ? 0.9 : 0.5,
      color: selected ? '#ff6b81' : '#718096',
      weight: selected ? 2 : 1,
    });
    marker.bindTooltip(s.station_name, { direction: 'top', offset: [0, -6] });
    marker.on('click', () => toggleStation(key));
    marker.addTo(mapLeft);
    stationMarkersLeft[key] = marker;
  });
  if (nullLatLng) console.warn(`[${ds}] ${nullLatLng} stations skipped — null lat/lng`);
}

function renderDatasetTaxiZones(stations) {
  taxiGeoJson.features.forEach(feat => {
    const zoneId = feat.properties.LocationID;
    const key = dsKey('taxi', zoneId);
    const selected = selectedIds.has(key);
    const layer = L.geoJSON(feat, {
      pane: 'taxiPane',
      style: {
        fillColor: selected ? SELECTED_COLOR : DEFAULT_COLOR,
        fillOpacity: selected ? 0.6 : 0.3,
        color: selected ? '#ff6b81' : '#718096',
        weight: selected ? 2 : 1,
      },
      onEachFeature: (f, l) => {
        l.bindTooltip(feat.properties.zone, { sticky: true });
        l.on('mousedown', (e) => L.DomEvent.stopPropagation(e));
        l.on('click', (e) => { L.DomEvent.stopPropagation(e); toggleStation(key); });
      }
    });
    layer.addTo(mapLeft);
    stationMarkersLeft[key] = layer;
  });
}

function toggleStation(key) {
  if (selectedIds.has(key)) {
    selectedIds.delete(key);
  } else {
    selectedIds.add(key);
  }
  console.debug(`[toggleStation] key=${key} selectedIds.size=${selectedIds.size}`);
  updateLeftMarkerStyles();
  fetchResults();
}

function updateLeftMarkerStyles() {
  for (const [ds, stations] of Object.entries(allStationsPerDataset)) {
    const isTaxi = ds === 'taxi';
    let missing = 0, updated = 0;
    stations.forEach(s => {
      const key = dsKey(ds, s.station_id);
      const marker = stationMarkersLeft[key];
      if (!marker) { missing++; return; }
      const selected = selectedIds.has(key);

      marker.setStyle({
        fillColor:   selected ? SELECTED_COLOR : DEFAULT_COLOR,
        fillOpacity: selected ? (isTaxi ? 0.6 : 0.9) : (isTaxi ? 0.3 : 0.5),
        color:  selected ? '#ff6b81' : '#718096',
        weight: selected ? 2 : 1,
      });
      if (marker.setRadius) marker.setRadius(selected ? 6 : 4);
      updated++;
    });
    console.debug(`[updateLeftMarkerStyles][${ds}] updated=${updated} missing=${missing}`);
  }
  document.getElementById('status-left').textContent = `${selectedIds.size} selected`;
}

// Rectangle drag selection on the left map using Leaflet events
mapLeft.on('mousedown', (e) => {
  if (!selectMode) return;
  dragStart = e.latlng;
  if (selectionRect) mapLeft.removeLayer(selectionRect);
  selectionRect = L.rectangle([dragStart, dragStart], {
    color: '#e94560', weight: 2, fillColor: '#e94560', fillOpacity: 0.15,
    dashArray: '6 3',
  }).addTo(mapLeft);
});

mapLeft.on('mousemove', (e) => {
  if (!dragStart || !selectMode) return;
  selectionRect.setBounds([dragStart, e.latlng]);
});

mapLeft.on('mouseup', (e) => {
  if (!dragStart || !selectMode) return;
  const bounds = L.latLngBounds(dragStart, e.latlng);
  dragStart = null;

  // If very small rectangle, treat as click (handled by marker click)
  const size = mapLeft.latLngToContainerPoint(bounds.getNorthEast())
    .distanceTo(mapLeft.latLngToContainerPoint(bounds.getSouthWest()));
  if (size < 10) {
    if (selectionRect) mapLeft.removeLayer(selectionRect);
    return;
  }

  // Select stations/zones within bounds (all active datasets)
  selectedIds.clear();
  for (const [ds, stations] of Object.entries(allStationsPerDataset)) {
    stations.forEach(s => {
      if (bounds.contains([s.lat, s.lng])) selectedIds.add(dsKey(ds, s.station_id));
    });
  }
  updateLeftMarkerStyles();
  fetchResults();
});

// Fetch results from all active datasets in parallel
let fetchController = null;
async function fetchResults() {
  if (selectedIds.size === 0) { clearResults(); renderHourlyChart(null); renderRankedResults(null); clearPairDetail(); return; }
  fetchHourlyData();
  if (selectedPairDetail) fetchPairHourlyData();
  if (deltaMode) { fetchDeltaResults(); return; }

  if (fetchController) fetchController.abort();
  fetchController = new AbortController();

  const byDataset = groupSelectedByDataset();
  const direction = mode === 'dest' ? 'origins' : 'destinations';
  const idParam = mode === 'dest' ? 'dest_ids' : 'origin_ids';
  const month = document.getElementById('month').value;
  const day = document.getElementById('day').value;
  const hs = document.getElementById('hour-start').value;
  const he = document.getElementById('hour-end').value;
  const mc = document.getElementById('member-casual').value;

  try {
    const promises = Object.entries(byDataset).map(([ds, ids]) =>
      fetch(`/api/${ds}/${direction}?${buildFilterParams(idParam, ids, month, day, hs, he, ds === 'citibike' ? mc : '')}`,
        { signal: fetchController.signal })
        .then(r => r.json())
        .then(data => data.map(d => ({ ...d, _dataset: ds })))
    );
    renderResults((await Promise.all(promises)).flat());
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}


function clearResults() {
  resultMarkersRight.forEach(m => mapRight.removeLayer(m));
  resultMarkersRight = [];
  lastResultData = [];
  selectedPairDetail = null;
  clearPairDetail();
  renderRankedResults(null);
  document.getElementById('status-right').textContent = 'Total: —';
  document.getElementById('right-label').textContent =
    mode === 'dest' ? 'Origins will appear here' : 'Destinations will appear here';
}

function renderResults(data) {
  resultMarkersRight.forEach(m => mapRight.removeLayer(m));
  resultMarkersRight = [];
  lastResultData = data;

  if (data.length === 0) {
    clearResults();
    return;
  }

  const eKey = (d) => dsKey(d._dataset, d.station_id);
  const visible = data.filter(d => !excludedIds.has(eKey(d)));
  const maxRidership = visible.length > 0 ? Math.max(...visible.map(d => d.total_ridership)) : 1;
  const totalRidership = visible.reduce((sum, d) => sum + d.total_ridership, 0);
  renderRankedResults(visible);

  data.forEach(d => {
    const k = eKey(d);
    const excluded = excludedIds.has(k);
    const ratio = excluded ? 0 : d.total_ridership / maxRidership;
    const status = excluded ? ' (excluded)' : '';
    const tooltipHtml = `<b>${d.station_name}</b>${status}<br>${d._dataset === 'taxi' ? 'Trips' : 'Ridership'}: ${Math.round(d.total_ridership).toLocaleString()}<br><i>Click for O-D profile; Option-click to ${excluded ? 'include' : 'exclude'}</i>`;

    let marker;
    if (d._dataset === 'taxi' && taxiGeoJson) {
      const feat = taxiGeoJson.features.find(f => f.properties.LocationID === d.station_id);
      if (!feat) return;
      marker = L.geoJSON(feat, {
        pane: 'taxiPane',
        style: {
          fillColor: excluded ? '#555' : interpolateColor(ratio),
          fillOpacity: excluded ? 0.2 : 0.3 + ratio * 0.5,
          color: excluded ? '#777' : '#00d2ff',
          weight: excluded ? 1 : (ratio > 0.5 ? 2 : 1),
        }
      });
      marker.bindTooltip(tooltipHtml, { sticky: true });
    } else {
      const radius = excluded ? 4 : 3 + ratio * 15;
      marker = L.circleMarker([d.lat, d.lng], {
        radius,
        fillColor: excluded ? '#555' : interpolateColor(ratio),
        fillOpacity: excluded ? 0.3 : 0.75,
        color: excluded ? '#777' : '#00d2ff',
        weight: excluded ? 1 : (ratio > 0.5 ? 1.5 : 0.5),
      });
      marker.bindTooltip(tooltipHtml, { direction: 'top', offset: [0, -radius] });
    }

    marker.on('click', (ev) => {
      const original = ev.originalEvent || {};
      if (original.altKey || original.metaKey || original.ctrlKey) {
        if (excludedIds.has(k)) excludedIds.delete(k); else excludedIds.add(k);
        renderResults(lastResultData);
        return;
      }
      selectPairDetail(d);
    });
    marker.addTo(mapRight);
    resultMarkersRight.push(marker);
  });

  const label = mode === 'dest' ? 'Origins' : 'Destinations';
  const exCount = data.length - visible.length;
  const exLabel = exCount > 0 ? ` (${exCount} excluded)` : '';
  document.getElementById('right-label').textContent = `${label}: ${visible.length}${exLabel}`;
  document.getElementById('status-right').textContent =
    `Total: ${Math.round(totalRidership).toLocaleString()}`;

}

function interpolateColor(ratio) {
  // From cool blue (low) to bright cyan/white (high)
  const r = Math.round(0 + ratio * 100);
  const g = Math.round(100 + ratio * 155);
  const b = Math.round(180 + ratio * 75);
  return `rgb(${r},${g},${b})`;
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('mode-dest').classList.toggle('active', mode === 'dest');
  document.getElementById('mode-origin').classList.toggle('active', mode === 'origin');
  document.getElementById('left-label').textContent =
    mode === 'dest' ? 'Select Destinations — drag to select' : 'Select Origins — drag to select';
  clearSelection();
}

function clearSelection() {
  selectedIds.clear();
  selectedPairDetail = null;
  if (selectionRect) { mapLeft.removeLayer(selectionRect); selectionRect = null; }
  updateLeftMarkerStyles();
  clearResults();
  renderHourlyChart(null);
}

  window.location.href = `/clustering?${params.toString()}`;
}

// Render preset buttons dynamically from the PRESETS object
(function renderPresetButtons() {
  const group = document.getElementById('preset-group');
  Object.entries(PRESETS).forEach(([key, preset]) => {
    if (!preset.label) return;
    const btn = document.createElement('button');
    btn.textContent = preset.label;
    btn.onclick = () => applyPreset(key);
    group.appendChild(btn);
  });
})();

async function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;

  // Mode
  if (p.mode) setMode(p.mode);

  // A filters
  document.getElementById('month').value = p.month ?? '';
  document.getElementById('day').value = p.day ?? '';
  document.getElementById('hour-start').value = p.hourStart ?? '';
  document.getElementById('hour-end').value = p.hourEnd ?? '';

  // Normalize per hour
  const wantNormalize = p.normalizePerHour ?? false;
  if (wantNormalize !== normalizePerHour) toggleNormalize();

  // Delta mode + B filters
  const wantDelta = !!(p.delta || p.compare);
  if (wantDelta !== deltaMode) toggleDeltaMode();
  if (p.compare) {
    document.getElementById('month-b').value = p.compare.month ?? '';
    document.getElementById('day-b').value = p.compare.day ?? '';
    document.getElementById('hour-start-b').value = p.compare.hourStart ?? '';
    document.getElementById('hour-end-b').value = p.compare.hourEnd ?? '';
  }

  // Pre-select stations/zones
  const selEntries = Object.entries(p.selections || {}).filter(([, ids]) => ids.length > 0);
  if (selEntries.length > 0) {
    selectedIds.clear();
    const loadPromises = selEntries
      .filter(([ds]) => !activeDatasets.has(ds))
      .map(([ds]) => { activeDatasets.add(ds); return loadDatasetStations(ds); });
    if (loadPromises.length > 0) {
      updateDatasetButtons();
      await Promise.all(loadPromises);
    }
    selEntries.forEach(([ds, ids]) => ids.forEach(id => selectedIds.add(dsKey(ds, id))));
    updateLeftMarkerStyles();
  }

  if (selectedIds.size > 0) fetchResults();
}

// ── Delta mode ──

let deltaMode = false;
let normalizePerHour = true;

function hoursInRange(hs, he) {
  if (hs === '' || he === '') return 24;
  const s = parseInt(hs), e = parseInt(he);
  return s <= e ? (e - s + 1) : (24 - s + e + 1);
}

function toggleNormalize() {
  normalizePerHour = !normalizePerHour;
  document.getElementById('btn-normalize').classList.toggle('active', normalizePerHour);
  if (lastResultData && lastResultData._delta) {
    renderDeltaResults(lastResultData.dataA, lastResultData.dataB);
  }
}

function toggleDeltaMode() {
  deltaMode = !deltaMode;
  document.getElementById('btn-delta').classList.toggle('active', deltaMode);
  const bar = document.getElementById('delta-bar');
  bar.style.display = deltaMode ? 'flex' : 'none';
  // Leaflet maps must recalculate their container bounds after layout shifts
  setTimeout(() => { mapLeft.invalidateSize(); mapRight.invalidateSize(); }, 0);
  if (selectedIds.size > 0) fetchResults();
}

function reRenderResults() {
  excludedIds.clear();
  if (lastResultData && lastResultData._delta) {
    renderDeltaResults(lastResultData.dataA, lastResultData.dataB);
  } else {
    renderResults(lastResultData);
  }
}

// Extract selected IDs grouped by dataset (reused by both fetch functions)
function groupSelectedByDataset() {
  const byDataset = {};
  for (const key of selectedIds) {
    const colonIdx = key.indexOf(':');
    const ds = key.slice(0, colonIdx);
    const id = key.slice(colonIdx + 1);
    if (!byDataset[ds]) byDataset[ds] = [];
    byDataset[ds].push(id);
  }
  return byDataset;
}

// Build URLSearchParams for one set of filter values
function buildFilterParams(idParam, ids, month, day, hourStart, hourEnd, memberCasual) {
  const params = new URLSearchParams();
  params.set(idParam, ids.join(','));
  if (month) params.set('month', month);
  if (day) params.set('day_of_week', day);
  if (hourStart !== '' && hourEnd !== '') {
    params.set('hour_start', hourStart);
    params.set('hour_end', hourEnd);
  }
  if (memberCasual) params.set('member_casual', memberCasual);
  return params;
}

async function fetchDeltaResults() {
  if (fetchController) fetchController.abort();
  fetchController = new AbortController();

  const byDataset = groupSelectedByDataset();
  const direction = mode === 'dest' ? 'origins' : 'destinations';
  const idParam = mode === 'dest' ? 'dest_ids' : 'origin_ids';

  const monthA = document.getElementById('month').value;
  const dayA = document.getElementById('day').value;
  const hsA = document.getElementById('hour-start').value;
  const heA = document.getElementById('hour-end').value;

  const monthB = document.getElementById('month-b').value;
  const dayB = document.getElementById('day-b').value;
  const hsB = document.getElementById('hour-start-b').value;
  const heB = document.getElementById('hour-end-b').value;

  const mc = document.getElementById('member-casual').value;

  const fetchSet = (month, day, hs, he) =>
    Promise.all(Object.entries(byDataset).map(([ds, ids]) =>
      fetch(`/api/${ds}/${direction}?${buildFilterParams(idParam, ids, month, day, hs, he, ds === 'citibike' ? mc : '')}`,
        { signal: fetchController.signal })
        .then(r => r.json())
        .then(data => data.map(d => ({ ...d, _dataset: ds })))
    )).then(r => r.flat());

  try {
    const [dataA, dataB] = await Promise.all([
      fetchSet(monthA, dayA, hsA, heA),
      fetchSet(monthB, dayB, hsB, heB),
    ]);
    renderDeltaResults(dataA, dataB);
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

function renderDeltaResults(dataA, dataB) {
  resultMarkersRight.forEach(m => mapRight.removeLayer(m));
  resultMarkersRight = [];
  lastResultData = { _delta: true, dataA, dataB };
  renderRankedResults(null);

  const mapA = new Map(dataA.map(d => [dsKey(d._dataset, d.station_id), d]));
  const mapB = new Map(dataB.map(d => [dsKey(d._dataset, d.station_id), d]));
  const allKeys = new Set([...mapA.keys(), ...mapB.keys()]);

  const hoursA = normalizePerHour ? hoursInRange(
    document.getElementById('hour-start').value,
    document.getElementById('hour-end').value) : 1;
  const hoursB = normalizePerHour ? hoursInRange(
    document.getElementById('hour-start-b').value,
    document.getElementById('hour-end-b').value) : 1;

  const deltas = [];
  for (const key of allKeys) {
    const a = mapA.get(key), b = mapB.get(key);
    const ref = a || b;
    const rA = a ? a.total_ridership / hoursA : 0;
    const rB = b ? b.total_ridership / hoursB : 0;
    deltas.push({
      _dataset: ref._dataset, station_id: ref.station_id,
      station_name: ref.station_name, lat: ref.lat, lng: ref.lng,
      rA, rB,
      delta: rA - rB,
    });
  }

  if (deltas.length === 0) { clearResults(); return; }

  const maxAbs = Math.max(...deltas.map(d => Math.abs(d.delta)), 1);

  deltas.forEach(d => {
    const ratio = d.delta / maxAbs; // -1 to +1
    const absRatio = Math.abs(ratio);
    const sign = d.delta >= 0 ? '+' : '';
    const perHrLabel = normalizePerHour ? '/hr' : '';
    const tip = `<b>${d.station_name}</b><br>A: ${Math.round(d.rA).toLocaleString()}${perHrLabel} &nbsp; B: ${Math.round(d.rB).toLocaleString()}${perHrLabel}<br>Δ: ${sign}${Math.round(d.delta).toLocaleString()}${perHrLabel}`;

    let marker;
    if (d._dataset === 'taxi' && taxiGeoJson) {
      const feat = taxiGeoJson.features.find(f => f.properties.LocationID === d.station_id);
      if (!feat) return;
      marker = L.geoJSON(feat, {
        pane: 'taxiPane',
        style: {
          fillColor: interpolateDeltaColor(ratio),
          fillOpacity: 0.15 + absRatio * 0.65,
          color: interpolateDeltaColor(ratio),
          weight: 1 + absRatio,
        }
      });
      marker.bindTooltip(tip, { sticky: true });
    } else {
      const radius = 3 + absRatio * 12;
      marker = L.circleMarker([d.lat, d.lng], {
        radius,
        fillColor: interpolateDeltaColor(ratio),
        fillOpacity: 0.25 + absRatio * 0.55,
        color: interpolateDeltaColor(ratio),
        weight: 1,
      });
      marker.bindTooltip(tip, { direction: 'top', offset: [0, -radius] });
    }
    marker.addTo(mapRight);
    resultMarkersRight.push(marker);
  });

  const label = mode === 'dest' ? 'Origins Δ' : 'Destinations Δ';
  document.getElementById('right-label').textContent = `${label}: ${deltas.length}`;
  document.getElementById('status-right').textContent = `A vs B — cyan = more A, orange = more B`;

  // Heatmap shows absolute magnitude of change
}

function interpolateDeltaColor(ratio) {
  // ratio: -1 (more in B, orange) → 0 (gray) → +1 (more in A, cyan)
  if (ratio >= 0) {
    const t = ratio;
    return `rgb(${Math.round(160*(1-t))},${Math.round(160+t*50)},${Math.round(192+t*63)})`;
  } else {
    const t = -ratio;
    return `rgb(${Math.round(160+t*95)},${Math.round(160-t*110)},${Math.round(192-t*150)})`;
  }
}

// ── Volume-based OD-pair journey view ──

function selectedIdsForDataset(ds) {
  return [...selectedIds]
    .filter(key => dsOfKey(key) === ds)
    .map(key => key.slice(key.indexOf(':') + 1));
}

function selectedStationNamesForDataset(ds) {
  const selected = new Set(selectedIdsForDataset(ds).map(String));
  return (allStationsPerDataset[ds] || [])
    .filter(s => selected.has(String(s.station_id)))
    .map(s => s.station_name);
}

function selectPairDetail(result) {
  const selectedForDataset = selectedIdsForDataset(result._dataset);
  if (selectedForDataset.length === 0) {
    clearPairDetail('Select at least one matching origin/destination first.');
    return;
  }
  const selectedNames = selectedStationNamesForDataset(result._dataset);
  selectedPairDetail = {
    dataset: result._dataset,
    resultId: String(result.station_id),
    resultName: result.station_name,
    selectedIds: selectedForDataset,
    selectedNames,
    modeAtSelection: mode,
  };
  fetchPairHourlyData();
}

async function fetchPairHourlyData() {
  if (!selectedPairDetail) return;
  const detail = selectedPairDetail;
  const selectedForDataset = selectedIdsForDataset(detail.dataset);
  if (selectedForDataset.length === 0) {
    clearPairDetail('The selected O-D profile no longer matches the current selection.');
    return;
  }
  detail.selectedIds = selectedForDataset;
  detail.selectedNames = selectedStationNamesForDataset(detail.dataset);

  const p = new URLSearchParams();
  if (mode === 'dest') {
    p.set('origin_ids', detail.resultId);
    p.set('dest_ids', selectedForDataset.join(','));
  } else {
    p.set('origin_ids', selectedForDataset.join(','));
    p.set('dest_ids', detail.resultId);
  }
  const month = document.getElementById('month').value;
  const day = document.getElementById('day').value;
  const mc = document.getElementById('member-casual').value;
  if (month) p.set('month', month);
  if (day) p.set('day_of_week', day);
  if (detail.dataset === 'citibike' && mc) p.set('member_casual', mc);

  try {
    const resp = await fetch(`/api/${detail.dataset}/pair_hourly?${p}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const hours = new Array(24).fill(0);
    data.forEach(d => { hours[d.hour] = d.total || 0; });
    renderPairDetail(detail, hours);
  } catch (e) {
    console.error(e);
    clearPairDetail('Could not load this O-D profile for the current dataset.');
  }
}

function clearPairDetail(message) {
  document.getElementById('journey-empty').style.display = '';
  document.getElementById('journey-empty').textContent =
    message || 'Click a result on the right map to inspect its O-D hourly volume profile.';
  d3.select('#pair-bar-svg').style('display', 'none').selectAll('*').remove();
}

function renderPairDetail(detail, hours) {
  const empty = document.getElementById('journey-empty');
  empty.style.display = 'none';
  d3.select('#pair-bar-svg').style('display', 'block');

  const fromLabel = mode === 'dest'
    ? detail.resultName
    : (detail.selectedNames.length === 1 ? detail.selectedNames[0] : `${detail.selectedNames.length} selected origins`);
  const toLabel = mode === 'dest'
    ? (detail.selectedNames.length === 1 ? detail.selectedNames[0] : `${detail.selectedNames.length} selected destinations`)
    : detail.resultName;
  const total = d3.sum(hours);
  const peakHour = d3.greatestIndex(hours);
  const maxValue = d3.max(hours) || 1;

  renderPairBars(hours, {
    title: `${fromLabel} -> ${toLabel}`,
    subtitle: `${detail.dataset} O-D volume: ${Math.round(total).toLocaleString()} total, peak ${String(peakHour).padStart(2,'0')}:00`,
    maxValue,
  });
}

function renderPairBars(hours, meta) {
  const svgEl = document.getElementById('pair-bar-svg');
  const svg = d3.select(svgEl);
  svg.selectAll('*').remove();
  const W = Math.max(320, svgEl.clientWidth || svgEl.getBoundingClientRect().width || svgEl.parentElement.clientWidth);
  const H = 175;
  svg.attr('width', W).attr('height', H);
  const margin = { top: 36, right: 8, bottom: 26, left: 42 };
  const width = W - margin.left - margin.right;
  const height = H - margin.top - margin.bottom;

  svg.append('text')
    .attr('x', 0).attr('y', 12)
    .attr('class', 'journey-title')
    .text(meta.title);
  svg.append('text')
    .attr('x', 0).attr('y', 27)
    .attr('fill', '#6a6a8a').attr('font-size', '10px')
    .text(meta.subtitle);

  const data = d3.range(24).map(hour => ({ hour, total: hours[hour] || 0 }));
  const x = d3.scaleBand().domain(d3.range(24)).range([0, width]).padding(0.16);
  const y = d3.scaleLinear().domain([0, meta.maxValue]).nice().range([height, 0]);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.append('g')
    .call(d3.axisLeft(y).ticks(3).tickSize(-width).tickFormat(''))
    .call(ax => {
      ax.select('.domain').remove();
      ax.selectAll('.tick line').attr('stroke', '#2a3a5e').attr('stroke-dasharray', '3,3');
    });
  g.selectAll('rect')
    .data(data)
    .join('rect')
    .attr('x', d => x(d.hour))
    .attr('y', d => y(d.total))
    .attr('width', x.bandwidth())
    .attr('height', d => height - y(d.total))
    .attr('fill', '#e94560')
    .attr('opacity', d => d.total ? 0.35 + 0.55 * (d.total / meta.maxValue) : 0.2)
    .append('title')
    .text(d => `${String(d.hour).padStart(2,'0')}:00 - ${Math.round(d.total).toLocaleString()}`);

  g.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(x).tickValues([0, 6, 12, 18, 23]).tickFormat(h => `${h}`))
    .call(ax => {
      ax.select('.domain').attr('stroke', '#2a3a5e');
      ax.selectAll('.tick line').attr('stroke', '#2a3a5e');
      ax.selectAll('.tick text').attr('fill', '#a0a0c0').attr('font-size', '9px');
    });
  g.append('g')
    .call(d3.axisLeft(y).ticks(3).tickFormat(d3.format('.2~s')))
    .call(ax => {
      ax.select('.domain').remove();
      ax.selectAll('.tick line').remove();
      ax.selectAll('.tick text').attr('fill', '#a0a0c0').attr('font-size', '9px');
    });
}

// ── Hourly chart ──

async function fetchHourlyData() {
  if (selectedIds.size === 0) { renderHourlyChart(null); return; }

  const byDataset = groupSelectedByDataset();
  const idParam = mode === 'dest' ? 'dest_ids' : 'origin_ids';
  const month = document.getElementById('month').value;
  const day = document.getElementById('day').value;
  const mc = document.getElementById('member-casual').value;

  function buildParams(ds, ids) {
    const p = new URLSearchParams();
    p.set(idParam, ids.join(','));
    if (month) p.set('month', month);
    if (day) p.set('day_of_week', day);
    if (ds === 'citibike' && mc) p.set('member_casual', mc);
    return p;
  }

  try {
    const results = await Promise.all(
      Object.entries(byDataset).map(([ds, ids]) =>
        fetch(`/api/${ds}/hourly?${buildParams(ds, ids)}`).then(r => r.json())
      )
    );
    const hourMap = new Array(24).fill(0);
    results.forEach(data => data.forEach(d => { hourMap[d.hour] += d.total; }));
    renderHourlyChart(hourMap);
  } catch(e) { console.error(e); }
}

function renderHourlyChart(hourData) {
  const svgEl = document.getElementById('hourly-svg');
  if (!svgEl) return;

  const svg = d3.select('#hourly-svg');
  svg.selectAll('*').remove();

  const containerH = 185;
  const margin = { top: 22, right: 16, bottom: 28, left: 48 };
  const W = svgEl.clientWidth || svgEl.getBoundingClientRect().width || (svgEl.parentElement.clientWidth - 32);
  const H = containerH - 8; // leave room for container padding
  svg.attr('width', W).attr('height', H);

  const width = W - margin.left - margin.right;
  const height = H - margin.top - margin.bottom;

  // Title
  const hs = document.getElementById('hour-start').value;
  const he = document.getElementById('hour-end').value;
  const hasFilter = hs !== '' && he !== '';
  const dirLabel = mode === 'dest' ? 'at Selected Destinations' : 'at Selected Origins';
  const titleText = hourData && !hourData.every(v => v === 0)
    ? `Hourly Traffic ${dirLabel}`
    : 'Hourly Traffic — select a region to see the daily pattern';

  svg.append('text')
    .attr('x', margin.left)
    .attr('y', 13)
    .attr('fill', '#a0a0c0')
    .attr('font-size', '11px')
    .text(titleText);

  // Legend (only shown when a filter is active and we have data)
  if (hourData && !hourData.every(v => v === 0)) {
    const legendX = W - margin.right;
    const ly = 8;
    const legendItems = hasFilter
      ? [{ color: '#00d2ff', label: 'In filter window' }, { color: '#334155', label: 'Outside window' }]
      : [{ color: '#00d2ff', label: 'All hours' }];

    legendItems.forEach((item, i) => {
      const lx = legendX - (legendItems.length - i) * 115;
      svg.append('rect').attr('x', lx).attr('y', ly - 7).attr('width', 9).attr('height', 9)
        .attr('fill', item.color).attr('rx', 1);
      svg.append('text').attr('x', lx + 12).attr('y', ly + 1)
        .attr('fill', '#a0a0c0').attr('font-size', '10px').text(item.label);
    });
  }

  if (!hourData || hourData.every(v => v === 0)) return;

  function inRange(h) {
    if (!hasFilter) return true;
    const s = parseInt(hs), e = parseInt(he);
    return s <= e ? (h >= s && h <= e) : (h >= s || h <= e);
  }

  const data = d3.range(24).map(h => ({ hour: h, total: hourData[h] || 0, active: inRange(h) }));

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(d3.range(24)).range([0, width]).padding(0.12);
  const y = d3.scaleLinear().domain([0, d3.max(data, d => d.total)]).nice().range([height, 0]);

  // Subtle horizontal grid lines
  g.append('g')
    .call(d3.axisLeft(y).ticks(4).tickSize(-width).tickFormat(''))
    .call(ax => {
      ax.select('.domain').remove();
      ax.selectAll('.tick line').attr('stroke', '#2a3a5e').attr('stroke-dasharray', '3,3');
    });

  // Hour-range highlight band
  if (hasFilter) {
    data.filter(d => d.active).forEach(d => {
      g.append('rect')
        .attr('x', x(d.hour)).attr('y', 0)
        .attr('width', x.bandwidth()).attr('height', height)
        .attr('fill', '#e94560').attr('opacity', 0.07);
    });
  }

  // Bars
  g.selectAll('.bar')
    .data(data)
    .join('rect')
    .attr('class', 'bar')
    .attr('x', d => x(d.hour))
    .attr('y', d => y(d.total))
    .attr('width', x.bandwidth())
    .attr('height', d => height - y(d.total))
    .attr('fill', d => d.active ? '#00d2ff' : '#334155')
    .attr('opacity', d => d.active ? 0.9 : 0.6)
    .append('title').text(d => `${String(d.hour).padStart(2,'0')}:00 — ${d.total.toLocaleString()}`);

  // X axis
  g.append('g')
    .attr('transform', `translate(0,${height})`)
    .call(d3.axisBottom(x)
      .tickValues([0, 3, 6, 9, 12, 15, 18, 21, 23])
      .tickFormat(h => `${String(h).padStart(2,'0')}:00`))
    .call(ax => {
      ax.select('.domain').attr('stroke', '#2a3a5e');
      ax.selectAll('.tick line').attr('stroke', '#2a3a5e');
      ax.selectAll('.tick text').attr('fill', '#a0a0c0').attr('font-size', '9px');
    });

  // Y axis
  g.append('g')
    .call(d3.axisLeft(y).ticks(4).tickFormat(d3.format('.2~s')))
    .call(ax => {
      ax.select('.domain').remove();
      ax.selectAll('.tick line').remove();
      ax.selectAll('.tick text').attr('fill', '#a0a0c0').attr('font-size', '9px');
    });

  // Y axis label
  g.append('text')
    .attr('transform', 'rotate(-90)')
    .attr('x', -height / 2).attr('y', -40)
    .attr('text-anchor', 'middle')
    .attr('fill', '#606080').attr('font-size', '9px')
    .text('ridership');
}

// ── Ranked destinations/origins chart ──

function renderRankedResults(results) {
  const svgEl = document.getElementById('ranked-results-svg');
  if (!svgEl) return;

  const svg = d3.select('#ranked-results-svg');
  svg.selectAll('*').remove();

  const containerH = 185;
  const W = svgEl.clientWidth || svgEl.getBoundingClientRect().width || svgEl.parentElement.clientWidth;
  const H = containerH - 8;
  svg.attr('width', W).attr('height', H);

  const margin = { top: 22, right: 18, bottom: 14, left: 116 };
  const width = Math.max(10, W - margin.left - margin.right);
  const height = H - margin.top - margin.bottom;
  const label = mode === 'dest' ? 'Top Origins' : 'Top Destinations';

  svg.append('text')
    .attr('x', 0)
    .attr('y', 13)
    .attr('fill', '#a0a0c0')
    .attr('font-size', '11px')
    .text(results && results.length ? `${label} by Volume` : `${label} — select a station or region`);

  if (!results || results.length === 0) return;

  const top = [...results]
    .sort((a, b) => b.total_ridership - a.total_ridership)
    .slice(0, 10);
  const maxValue = d3.max(top, d => d.total_ridership) || 1;
  const y = d3.scaleBand()
    .domain(top.map((_, i) => i))
    .range([0, height])
    .padding(0.22);
  const x = d3.scaleLinear()
    .domain([0, maxValue])
    .nice()
    .range([0, width]);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.selectAll('.rank-bg')
    .data(top)
    .join('rect')
    .attr('class', 'rank-bg')
    .attr('x', 0)
    .attr('y', (_, i) => y(i))
    .attr('width', width)
    .attr('height', y.bandwidth())
    .attr('fill', '#111928')
    .attr('rx', 2);

  g.selectAll('.rank-bar')
    .data(top)
    .join('rect')
    .attr('class', 'rank-bar')
    .attr('x', 0)
    .attr('y', (_, i) => y(i))
    .attr('width', d => x(d.total_ridership))
    .attr('height', y.bandwidth())
    .attr('fill', d => d._dataset === 'taxi' ? '#ffc857' : d._dataset === 'citibike' ? '#55efc4' : '#00d2ff')
    .attr('opacity', 0.82)
    .attr('rx', 2)
    .append('title')
    .text(d => `${d.station_name} - ${Math.round(d.total_ridership).toLocaleString()}`);

  g.selectAll('.rank-label')
    .data(top)
    .join('text')
    .attr('class', 'rank-label')
    .attr('x', -8)
    .attr('y', (_, i) => y(i) + y.bandwidth() / 2 + 3)
    .attr('text-anchor', 'end')
    .attr('fill', '#a0a0c0')
    .attr('font-size', '9px')
    .text(d => {
      const prefix = top.length > 1 && activeDatasets.size > 1 ? `${d._dataset}: ` : '';
      const name = `${prefix}${d.station_name}`;
      return name.length > 21 ? name.slice(0, 20) + '...' : name;
    });

  g.selectAll('.rank-value')
    .data(top)
    .join('text')
    .attr('class', 'rank-value')
    .attr('x', d => Math.min(width - 4, x(d.total_ridership) + 5))
    .attr('y', (_, i) => y(i) + y.bandwidth() / 2 + 3)
    .attr('fill', '#e0e0e0')
    .attr('font-size', '9px')
    .text(d => d3.format('.2~s')(d.total_ridership));
}

// ── Tab switching ──

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.ctrl-panel').forEach(p => p.style.display = 'none');
  // Activate matching tab button
  document.querySelectorAll('#ctrl-tab-bar .tab-btn').forEach(b => {
    if (b.textContent.toLowerCase().includes(
          name === 'conditions' ? 'set' : name === 'presets' ? 'preset' : 'ask'))
      b.classList.add('active');
  });
  document.getElementById('tab-' + name).style.display = 'flex';
}

// ── Ask AI ──

function handleAIQuery() {
  const q = document.getElementById('ai-query').value.trim();
  if (!q) return;
  const el = document.getElementById('ai-response');
  el.className = 'ai-response ai-thinking';
  el.innerHTML = '⟳ Interpreting…';

  setTimeout(() => {
    const result = interpretQuery(q);
    el.className = 'ai-response';
    if (result) {
      el.innerHTML = result.html;
      result.apply();
    } else {
      el.innerHTML = '<span class="ai-note">Matched nothing — in production a language model would parse this and set conditions automatically.</span>';
    }
  }, 650);
}

function interpretQuery(q) {
  const rules = [
    {
      re: /knick|ranger|msg|madison square|garden.*game|game.*garden/i,
      label: 'Game night at MSG',
      chips: ['Evenings 19:00–23:00', 'Weekday / Weekend', 'MSG departure cluster'],
      apply() { document.getElementById('hour-start').value=19; document.getElementById('hour-end').value=23; }
    },
    {
      re: /barclay|net.*game|game.*net|brooklyn.*game/i,
      label: 'Game night at Barclays Center',
      chips: ['Evenings 19:00–23:00', 'Barclays departure cluster'],
      apply() { document.getElementById('hour-start').value=19; document.getElementById('hour-end').value=23; }
    },
    {
      re: /rain|wet|storm|umbrella|precipit/i,
      label: 'Rainy day',
      chips: ['Rain ≥ 5 mm', 'All hours'],
      apply() {
        const r = document.getElementById('rain-threshold');
        r.value = 5;
        document.getElementById('rain-label').textContent = '5 mm';
      }
    },
    {
      re: /friday night|fri.*night|night.*fri|friday.*evening/i,
      label: 'Friday night',
      chips: ['Friday', '19:00–23:00'],
      apply() {
        document.getElementById('day').value = 'Friday';
        document.getElementById('hour-start').value = 19;
        document.getElementById('hour-end').value = 23;
        if (selectedIds.size > 0) fetchResults();
      }
    },
    {
      re: /weekend|saturday|sunday/i,
      label: 'Weekend',
      chips: ['Saturday & Sunday', 'All hours'],
      apply() { document.getElementById('day').value = 'Weekend'; if (selectedIds.size > 0) fetchResults(); }
    },
    {
      re: /morning|commute|rush hour|9.?to.?5|peak/i,
      label: 'Morning rush hour',
      chips: ['Weekday', '07:00–09:00'],
      apply() {
        document.getElementById('day').value = 'Weekday';
        document.getElementById('hour-start').value = 7;
        document.getElementById('hour-end').value = 9;
        if (selectedIds.size > 0) fetchResults();
      }
    },
    {
      re: /late night|midnight|bar|club|nightlife/i,
      label: 'Late night / nightlife',
      chips: ['Friday & Saturday', '22:00–02:00'],
      apply() {
        document.getElementById('day').value = 'Friday';
        document.getElementById('hour-start').value = 22;
        document.getElementById('hour-end').value = 2;
        if (selectedIds.size > 0) fetchResults();
      }
    },
  ];

  for (const r of rules) {
    if (r.re.test(q)) {
      const chipHtml = r.chips.map(c => `<span class="ai-chip">${c}</span>`).join('');
      return {
        html: `<b style="color:#e0e0e0">${r.label}</b> — ${chipHtml}`,
        apply: r.apply,
      };
    }
  }
  return null;
}
